[package]
name = "zygiskfrida"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
verbose-logs = []

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
