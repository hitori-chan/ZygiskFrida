import org.apache.tools.ant.filters.FixCrLfFilter
import org.apache.tools.ant.filters.ReplaceTokens

import java.nio.file.Paths
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.Locale

plugins {
    id "de.undercouch.download" version "5.4.0"
}

apply plugin: 'com.android.library'
apply from: file(rootProject.file('module.gradle'))

def rustTargets = [
        "armeabi-v7a": [
                target: "armv7-linux-androideabi",
                linker: "armv7a-linux-androideabi${rootProject.ext.targetSdkVersion}-clang",
                linkerEnv: "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER",
        ],
        "arm64-v8a": [
                target: "aarch64-linux-android",
                linker: "aarch64-linux-android${rootProject.ext.targetSdkVersion}-clang",
                linkerEnv: "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER",
        ],
        "x86": [
                target: "i686-linux-android",
                linker: "i686-linux-android${rootProject.ext.targetSdkVersion}-clang",
                linkerEnv: "CARGO_TARGET_I686_LINUX_ANDROID_LINKER",
        ],
        "x86_64": [
                target: "x86_64-linux-android",
                linker: "x86_64-linux-android${rootProject.ext.targetSdkVersion}-clang",
                linkerEnv: "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER",
        ],
]

def androidSdkDir = {
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdkDir == null) {
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            def localProperties = new Properties()
            localPropertiesFile.withInputStream { localProperties.load(it) }
            sdkDir = localProperties.getProperty("sdk.dir")
        }
    }
    if (sdkDir == null) {
        throw new GradleException("Android SDK path is required; set ANDROID_HOME, ANDROID_SDK_ROOT, or sdk.dir")
    }
    file(sdkDir)
}

def adbExecutable = {
    def executable = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows") ? "adb.exe" : "adb"
    def adb = file("${androidSdkDir()}/platform-tools/${executable}")
    if (!adb.exists()) {
        throw new GradleException("adb not found at ${adb}")
    }
    adb.absolutePath
}

tasks.register("buildRust") {
    def rustDir = file("src/rust")
    def cargoTargetDir = layout.buildDirectory.dir("cargo")
    def rustJniLibsDir = layout.buildDirectory.dir("rustJniLibs")

    inputs.dir("$rustDir/src")
    inputs.file("$rustDir/Cargo.toml")
    inputs.file("$rustDir/Cargo.lock")
    outputs.files(rustTargets.keySet().collect { abi ->
        rustJniLibsDir.get().file("${abi}/libzygiskfrida.so").asFile
    })

    doLast {
        def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
        def hostTag = osName.contains("mac") ? "darwin-x86_64" : "linux-x86_64"
        def ndkToolchainDir = file("${androidSdkDir()}/ndk/${android.ndkVersion}/toolchains/llvm/prebuilt/${hostTag}/bin")
        if (!ndkToolchainDir.exists()) {
            throw new GradleException("Android NDK LLVM toolchain not found at ${ndkToolchainDir}")
        }

        rustTargets.values().each { cfg ->
            exec {
                workingDir rustDir
                commandLine "rustup", "target", "add", cfg.target
            }
        }

        rustTargets.each { abi, cfg ->
            exec {
                workingDir rustDir
                environment cfg.linkerEnv, file("$ndkToolchainDir/${cfg.linker}").absolutePath
                environment "CARGO_TARGET_DIR", cargoTargetDir.get().asFile.absolutePath
                commandLine "cargo", "build", "--release", "--target", cfg.target, "--locked"
            }
            def cargoOutput = cargoTargetDir.get().file("${cfg.target}/release/libzygiskfrida.so").asFile
            def jniLib = rustJniLibsDir.get().file("${abi}/libzygiskfrida.so").asFile
            jniLib.parentFile.mkdirs()
            Files.copy(cargoOutput.toPath(), jniLib.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

task downloadFrida(type: Download) {
    def downloadArchs = ["arm", "arm64", "x86_64", "x86"]
    def magiskArchs = ["arm", "arm64", "x64", "x86"]

    def sources = downloadArchs.collect{
        arch -> "https://github.com/frida/frida/releases/download/${fridaVersion}/frida-gadget-${fridaVersion}-android-${arch}.so.xz".toString()
    }

    def outputs = magiskArchs.collect{
        arch ->  "libgadget-${arch}.so.xz".toString()
    }

    def downloads = [sources, outputs].transpose().collectEntries()

    src downloads.keySet()
    dest "$rootDir/gadget"
    overwrite true
    onlyIfModified true
    quiet true
    eachFile { f ->
        f.name = downloads[f.sourceURL.toString()]
    }
}

android {
    namespace = "zygisk.frida"
    compileSdk = rootProject.ext.targetSdkVersion
    ndkVersion = '25.2.9519653'

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
    }

    sourceSets {
        main {
            jniLibs.srcDir file("$buildDir/rustJniLibs")
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("buildRust")
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantCapped = variant.name.capitalize()
        def buildTypeLowered = variant.buildType
        def rustJniLibsDir = layout.buildDirectory.dir("rustJniLibs")

        def zipName = "${moduleName}-${moduleVersion}-${buildTypeLowered}.zip"
        def magiskDir = file("${outDir}/magisk_module_${buildTypeLowered}")

        def prepareTask = tasks.register("prepareMagiskFiles${variantCapped}", Sync) {
            dependsOn("assemble$variantCapped")
            dependsOn downloadFrida

            def templatePath = "$rootDir/template/magisk_module"

            into magiskDir
            from(rootDir) {
                include 'config.json.example'
            }
            from(templatePath) {
                exclude 'module.prop'
                exclude 'customize.sh'
                exclude 'verify.sh'
            }
            from(templatePath) {
                include 'module.prop'
                expand([
                        id         : magiskModuleId,
                        name       : moduleName,
                        version    : moduleVersion,
                        versionCode: moduleVersionCode.toString(),
                        author     : moduleAuthor,
                        description: moduleDescription,
                        updateJson : moduleUpdateJson,
                ])
                filter(FixCrLfFilter.class, eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(templatePath) {
                include("customize.sh")
                include("verify.sh")
                def tokens = [
                        "MODULE_ID": magiskModuleId,
                ]
                filter(ReplaceTokens.class, tokens: tokens)
                filter(FixCrLfFilter.class, eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(rustJniLibsDir) {
                into 'lib'
            }
            from("$rootDir/gadget") {
                exclude '.gitkeep'
                into 'gadget'
            }
            doLast {
                fileTree("$magiskDir/lib") {
                    include "**/libzygiskfrida.so"
                }.files.each { lib ->
                    def abi = lib.parentFile.name
                    def dstPath = Paths.get("$magiskDir/lib/${abi}.so")
                    Files.move(lib.toPath(), dstPath)
                    lib.parentFile.deleteDir()
                }
                new File("$magiskDir/lib/lib").deleteDir()

                fileTree("$magiskDir").visit { f ->
                    if (f.directory) return

                    def md = MessageDigest.getInstance("SHA-256")
                    f.file.eachByte 4096, { bytes, size ->
                        md.update(bytes, 0, size)
                    }
                    file(f.file.path + ".sha256sum").text = md.digest().encodeHex()
                }
            }
        }

        def zipTask = tasks.register("zip${variantCapped}", Zip) {
            dependsOn(prepareTask)
            from magiskDir
            archiveFileName.set(zipName)
            destinationDirectory.set(outDir)
        }

        tasks.register("push${variantCapped}", Exec) {
            dependsOn(zipTask)
            workingDir outDir
            doFirst {
                commandLine adbExecutable(), "push", zipName, "/data/local/tmp/"
            }
        }

        tasks.register("flash${variantCapped}", Exec) {
            dependsOn("push${variantCapped}")
            doFirst {
                commandLine adbExecutable(), "shell", "su", "-c",
                        "magisk --install-module /data/local/tmp/${zipName}"
            }
        }

        tasks.register("flashAndReboot${variantCapped}", Exec) {
            dependsOn("flash${variantCapped}")
            doFirst {
                commandLine adbExecutable(), "shell", "reboot"
            }
        }

        tasks.matching { it.name == "assemble${variantCapped}" }.configureEach {
            finalizedBy(zipTask)
        }
    }
}
