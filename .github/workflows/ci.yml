name: CI-Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
      - uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install Rust Android targets
        run: >
          rustup target add
          armv7-linux-androideabi
          aarch64-linux-android
          i686-linux-android
          x86_64-linux-android
      - name: Install Android build dependencies
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager

          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platforms;android-32" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653"
      - name: Check Rust formatting
        working-directory: module/src/rust
        run: cargo fmt --check
      - name: Run Rust clippy
        working-directory: module/src/rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        working-directory: module/src/rust
        run: cargo test --locked
      - name: Test Build
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease
      - name: Get Module Version
        id: module-version
        run: |
          MODULE_VERSION=$(grep "moduleVersion =" module.gradle | awk -F'"' '{print $2}')
          echo "version=$MODULE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: ZygiskFrida-${{ steps.module-version.outputs.version }}-release
          path: out/ZygiskFrida-${{ steps.module-version.outputs.version }}-release.zip
